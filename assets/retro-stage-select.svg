<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Duke Yeah retro stage select</title>
  <desc id="desc">Three eight-bit project stages for Recruitment, memoranote, and DukeNote</desc>
  <defs>
    <pattern id="stage-grid" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#fff4d6" opacity=".12"/></pattern>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .select { animation: select 1.3s steps(2, start) infinite; }
      @keyframes select { 50% { opacity: .38; } }
      @media (prefers-reduced-motion: reduce) { .select { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="430" fill="#b7b2aa"/>
  <rect x="10" y="10" width="1180" height="410" fill="#d84a3a"/>
  <rect x="22" y="22" width="1156" height="386" fill="#29252d"/>
  <rect x="38" y="38" width="1124" height="354" fill="#0c0b0f"/>
  <rect x="38" y="38" width="1124" height="354" fill="url(#stage-grid)"/>
  <rect x="38" y="38" width="1124" height="46" fill="#fff4d6"/>
  <text x="60" y="69" class="mono" fill="#29252d" font-size="20" font-weight="700">WORLD 01 // SELECT STAGE</text>
  <text x="1140" y="69" text-anchor="end" class="mono" fill="#d84a3a" font-size="15" font-weight="700">3 MISSIONS FOUND</text>

  <g class="mono" transform="translate(62 112)">
    <rect width="328" height="224" fill="#17141b" stroke="#8cff00" stroke-width="6" class="select"/>
    <rect x="12" y="12" width="304" height="30" fill="#8cff00"/>
    <text x="24" y="34" fill="#111111" font-size="15" font-weight="700">STAGE 01 // SIGNAL SEARCH</text>

    <g transform="translate(128 58) scale(.75)" fill="#fff4d6">
      <rect x="24" width="48" height="12"/>
      <rect x="12" y="12" width="72" height="12"/>
      <rect y="24" width="36" height="48"/>
      <rect x="60" y="24" width="36" height="48"/>
      <rect x="12" y="72" width="72" height="12"/>
      <rect x="36" y="84" width="24" height="24" fill="#d84a3a"/>
      <rect x="60" y="108" width="12" height="24" fill="#d84a3a"/>
      <rect x="72" y="120" width="24" height="12" fill="#d84a3a"/>
      <rect x="24" y="36" width="12" height="12" fill="#6b278c"/>
      <rect x="60" y="36" width="12" height="12" fill="#6b278c"/>
    </g>
    <text x="164" y="178" text-anchor="middle" fill="#fff4d6" font-size="24" font-weight="700">RECRUITMENT</text>
    <text x="164" y="204" text-anchor="middle" fill="#8cff00" font-size="13">GO / REACT / LLM</text>
  </g>

  <g class="mono" transform="translate(436 112)">
    <rect width="328" height="224" fill="#17141b" stroke="#6b278c" stroke-width="4"/>
    <rect x="12" y="12" width="304" height="30" fill="#6b278c"/>
    <text x="24" y="34" fill="#fff4d6" font-size="15" font-weight="700">STAGE 02 // MEMORY CAPTURE</text>

    <g transform="translate(121 56) scale(.8)">
      <rect x="12" width="84" height="108" fill="#fff4d6"/>
      <rect width="12" height="108" fill="#d84a3a"/>
      <rect x="24" y="24" width="60" height="8" fill="#6b278c"/>
      <rect x="24" y="44" width="48" height="8" fill="#29252d"/>
      <rect x="24" y="64" width="60" height="8" fill="#29252d"/>
      <rect x="24" y="84" width="36" height="8" fill="#8cff00"/>
    </g>
    <text x="164" y="178" text-anchor="middle" fill="#fff4d6" font-size="24" font-weight="700">MEMORANOTE</text>
    <text x="164" y="204" text-anchor="middle" fill="#a86ad0" font-size="13">SWIFT / SWIFTUI / IOS</text>
  </g>

  <g class="mono" transform="translate(810 112)">
    <rect width="328" height="224" fill="#17141b" stroke="#d84a3a" stroke-width="4"/>
    <rect x="12" y="12" width="304" height="30" fill="#d84a3a"/>
    <text x="24" y="34" fill="#fff4d6" font-size="15" font-weight="700">STAGE 03 // NOTE SYSTEM</text>

    <g transform="translate(122 54) scale(.78)">
      <rect width="108" height="108" fill="#b7b2aa"/>
      <rect x="12" y="12" width="84" height="72" fill="#fff4d6"/>
      <rect x="24" y="28" width="60" height="8" fill="#6b278c"/>
      <rect x="24" y="48" width="48" height="8" fill="#29252d"/>
      <rect x="24" y="68" width="60" height="8" fill="#8cff00"/>
      <rect x="24" y="92" width="60" height="8" fill="#d84a3a"/>
    </g>
    <text x="164" y="178" text-anchor="middle" fill="#fff4d6" font-size="24" font-weight="700">DUKENOTE</text>
    <text x="164" y="204" text-anchor="middle" fill="#ff6a2a" font-size="13">SWIFT / SWIFTUI / MIT</text>
  </g>

  <g class="mono" font-size="14">
    <text x="62" y="372" fill="#8cff00">READY</text>
    <text x="130" y="372" fill="#77727d">//</text>
    <text x="160" y="372" fill="#fff4d6">CHOOSE A MISSION AND SHIP THE NEXT BUILD</text>
    <text x="1138" y="372" text-anchor="end" fill="#d84a3a">CREDIT 01</text>
  </g>
</svg>
