<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Duke Yeah retro mecha developer profile</title>
  <desc id="desc">An eight-bit red and white console screen with a purple and green pixel mecha</desc>

  <defs>
    <pattern id="pixels" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#6c6870" opacity=".32"/>
    </pattern>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect y="7" width="8" height="1" fill="#fff4d6" opacity=".035"/>
    </pattern>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      .pulse { animation: pulse 2s steps(3, end) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .blink, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#b7b2aa"/>
  <rect x="12" y="12" width="1176" height="536" fill="#d84a3a"/>
  <rect x="24" y="24" width="1152" height="512" fill="#29252d"/>
  <rect x="40" y="40" width="1120" height="480" fill="#0c0b0f"/>
  <rect x="40" y="40" width="1120" height="480" fill="url(#pixels)"/>
  <rect x="40" y="40" width="1120" height="480" fill="url(#scan)"/>

  <rect x="40" y="40" width="1120" height="44" fill="#fff4d6"/>
  <rect x="40" y="76" width="1120" height="8" fill="#d84a3a"/>
  <text x="60" y="69" class="mono" fill="#29252d" font-size="18" font-weight="700">DUKE SYSTEM // FAMILY PRODUCT COMPUTER</text>
  <text x="1140" y="69" text-anchor="end" class="mono" fill="#d84a3a" font-size="15" font-weight="700">1986 MODE</text>

  <g transform="translate(68 108)">
    <rect width="336" height="376" fill="#17141b" stroke="#fff4d6" stroke-width="4"/>
    <rect x="12" y="12" width="312" height="28" fill="#6b278c"/>
    <text x="28" y="33" class="mono" fill="#fff4d6" font-size="14" font-weight="700">PLAYER 1 // UNIT DY-01</text>

    <g transform="translate(84 54)">
      <rect x="48" y="0" width="72" height="12" fill="#8cff00" class="pulse"/>
      <rect x="24" y="12" width="120" height="12" fill="#6b278c"/>
      <rect x="12" y="24" width="144" height="24" fill="#6b278c"/>
      <rect x="0" y="48" width="168" height="72" fill="#431752"/>
      <rect x="12" y="120" width="144" height="36" fill="#6b278c"/>
      <rect x="24" y="156" width="120" height="24" fill="#32123d"/>
      <rect x="0" y="60" width="24" height="48" fill="#d84a3a"/>
      <rect x="144" y="60" width="24" height="48" fill="#d84a3a"/>
      <rect x="24" y="72" width="48" height="24" fill="#8cff00"/>
      <rect x="96" y="72" width="48" height="24" fill="#8cff00"/>
      <rect x="72" y="96" width="24" height="36" fill="#1a151d"/>
      <rect x="48" y="132" width="72" height="12" fill="#ff6a2a"/>
      <rect x="60" y="144" width="48" height="12" fill="#17141b"/>
      <rect x="-24" y="72" width="24" height="12" fill="#8cff00"/>
      <rect x="168" y="72" width="24" height="12" fill="#8cff00"/>
      <rect x="-36" y="60" width="12" height="36" fill="#8cff00"/>
      <rect x="192" y="60" width="12" height="36" fill="#8cff00"/>
