<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Eileenes triple unit deployment profile</title>
  <desc id="desc">A dark mecha command interface featuring purple-green Unit 01, red-orange Unit 02, and blue-yellow Unit 00</desc>
  <defs>
    <pattern id="command-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#25232a" stroke-width="1"/>
    </pattern>
    <pattern id="warning-stripe" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="skewX(-28)">
      <rect width="14" height="28" fill="#ff7a00"/>
      <rect x="14" width="14" height="28" fill="#151317"/>
    </pattern>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .ring { animation: rotate 16s linear infinite; transform-box: fill-box; transform-origin: center; }
      .counter { animation: rotate-reverse 11s linear infinite; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .scan { animation: scan 5s linear infinite; }
      @keyframes rotate { to { transform: rotate(360deg); } }
      @keyframes rotate-reverse { to { transform: rotate(-360deg); } }
      @keyframes pulse { 50% { opacity: .35; } }
      @keyframes scan { from { transform: translateY(-360px); } to { transform: translateY(520px); } }
      @media (prefers-reduced-motion: reduce) { .ring, .counter, .pulse, .scan { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#08090b"/>
  <rect width="1200" height="520" fill="url(#command-grid)" opacity=".75"/>
  <rect x="12" y="12" width="1176" height="496" fill="none" stroke="#38343d" stroke-width="2"/>
  <rect x="12" y="12" width="1176" height="8" fill="#8cff00"/>
  <rect x="12" y="500" width="280" height="8" fill="#6b278c"/>
  <rect x="292" y="500" width="280" height="8" fill="#d62828"/>
  <rect x="572" y="500" width="280" height="8" fill="#2357d4"/>
  <rect x="1010" y="480" width="178" height="28" fill="url(#warning-stripe)"/>

  <g class="mono">
    <text x="48" y="58" fill="#8cff00" font-size="14" font-weight="700">TRIPLE UNIT DEPLOYMENT // PROFILE SYSTEM</text>
    <text x="48" y="146" fill="#f4f1f6" font-size="66" font-weight="900">EILEENES</text>
    <text x="48" y="190" fill="#a9a3ae" font-size="19">DUKE YEAH / INDEPENDENT DEVELOPER</text>
    <rect x="48" y="214" width="438" height="6" fill="#6b278c"/>
    <rect x="48" y="214" width="154" height="6" fill="#8cff00"/>

    <text x="48" y="272" fill="#8cff00" font-size="15">UNIT-01</text>
    <text x="132" y="272" fill="#f4f1f6" font-size="17" font-weight="700">AI WORKFLOWS</text>
    <text x="48" y="318" fill="#ff594f" font-size="15">UNIT-02</text>
    <text x="132" y="318" fill="#f4f1f6" font-size="17" font-weight="700">PRODUCT ENGINEERING</text>
    <text x="48" y="364" fill="#ffd33d" font-size="15">UNIT-00</text>
    <text x="132" y="364" fill="#f4f1f6" font-size="17" font-weight="700">NATIVE IOS TOOLS</text>

    <rect x="48" y="404" width="148" height="28" fill="#8cff00"/>
    <text x="60" y="424" fill="#08090b" font-size="13" font-weight="900">SYSTEM ONLINE</text>
    <text x="220" y="424" fill="#79727f" font-size="13">BUILD / SHIP / ITERATE</text>
  </g>

  <g transform="translate(814 236)" fill="none" opacity=".7">
    <circle r="205" stroke="#6b278c" stroke-width="2" stroke-dasharray="18 12" class="ring"/>
    <circle r="178" stroke="#8cff00" stroke-width="1" stroke-dasharray="6 16" class="counter"/>
    <path d="M-224 0H-188M188 0H224M0-224V-188M0 188V224" stroke="#b98bd2" stroke-width="2"/>
  </g>

  <!-- Unit 01: purple / neon green -->
  <g transform="translate(684 54)">
    <path d="M130 0L222 30L276 104L264 214L216 306L130 350L44 306L-4 214L-16 104L38 30Z" fill="#17111d" stroke="#6b278c" stroke-width="8"/>
    <path d="M130 12L210 40L176 112H84L50 40Z" fill="#6b278c"/>
    <path d="M50 40L84 112L66 270L18 210L2 112Z" fill="#421550"/>
    <path d="M210 40L176 112L194 270L242 210L258 112Z" fill="#421550"/>
    <path d="M84 112H176L190 250L130 326L70 250Z" fill="#71308f"/>
    <path d="M70 124L118 148L94 188L52 166Z" fill="#8cff00" class="pulse"/>
    <path d="M190 124L142 148L166 188L208 166Z" fill="#8cff00" class="pulse"/>
    <path d="M108 188H152L166 254L130 292L94 254Z" fill="#1b121f"/>
    <path d="M102 250H158L148 270H112Z" fill="#ff7a00"/>
    <path d="M-16 126L-92 88L-42 164L8 184Z" fill="#8cff00"/>
    <path d="M276 126L352 88L302 164L252 184Z" fill="#8cff00"/>
    <path d="M42 34L-16-18L18 72Z" fill="#ff7a00"/>
    <path d="M218 34L276-18L242 72Z" fill="#ff7a00"/>
  </g>

  <!-- Unit 02: red / orange -->
  <g transform="translate(588 246) scale(.5)">
    <path d="M130 0L222 30L276 104L264 214L216 306L130 350L44 306L-4 214L-16 104L38 30Z" fill="#1b1010" stroke="#d62828" stroke-width="10"/>
    <path d="M130 12L210 40L176 112H84L50 40Z" fill="#d62828"/>
    <path d="M50 40L84 112L66 270L18 210L2 112Z" fill="#8f1717"/>
    <path d="M210 40L176 112L194 270L242 210L258 112Z" fill="#8f1717"/>
    <path d="M84 112H176L190 250L130 326L70 250Z" fill="#e43d32"/>
    <path d="M70 124L118 148L94 188L52 166Z" fill="#ffb000"/>
    <path d="M190 124L142 148L166 188L208 166Z" fill="#ffb000"/>
    <path d="M108 188H152L166 254L130 292L94 254Z" fill="#251213"/>
    <path d="M102 250H158L148 270H112Z" fill="#f4f1f6"/>
    <path d="M-16 126L-82 94L-40 160L8 184Z" fill="#ff7a00"/>
    <path d="M276 126L342 94L300 160L252 184Z" fill="#ff7a00"/>
  </g>

  <!-- Unit 00: blue / yellow -->
  <g transform="translate(1020 246) scale(.5)">
    <path d="M130 0L222 30L276 104L264 214L216 306L130 350L44 306L-4 214L-16 104L38 30Z" fill="#101522" stroke="#2357d4" stroke-width="10"/>
    <path d="M130 12L210 40L176 112H84L50 40Z" fill="#2357d4"/>
    <path d="M50 40L84 112L66 270L18 210L2 112Z" fill="#16348e"/>
    <path d="M210 40L176 112L194 270L242 210L258 112Z" fill="#16348e"/>
    <path d="M84 112H176L190 250L130 326L70 250Z" fill="#2f67db"/>
    <path d="M70 124L118 148L94 188L52 166Z" fill="#ffd33d"/>
    <path d="M190 124L142 148L166 188L208 166Z" fill="#ffd33d"/>
    <path d="M108 188H152L166 254L130 292L94 254Z" fill="#11182a"/>
    <path d="M102 250H158L148 270H112Z" fill="#f4f1f6"/>
    <path d="M-16 126L-82 94L-40 160L8 184Z" fill="#ffd33d"/>
    <path d="M276 126L342 94L300 160L252 184Z" fill="#ffd33d"/>
  </g>

  <rect x="0" y="0" width="1200" height="3" fill="#8cff00" opacity=".5" class="scan"/>
  <text x="1160" y="472" text-anchor="end" class="mono" fill="#77717c" font-size="11">SYNC 01 / 02 / 00 // NOMINAL</text>
</svg>
