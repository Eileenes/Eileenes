    <rect x="476" y="188" width="16" height="16" fill="#8cff00"/>
    <rect x="500" y="188" width="16" height="16" fill="#8cff00"/>
    <rect x="524" y="188" width="16" height="16" fill="#8cff00"/>

    <text x="0" y="248" fill="#d84a3a" font-size="15">MISSION 02</text>
    <text x="138" y="248" fill="#fff4d6" font-size="18" font-weight="700">NATIVE IOS TOOLS</text>
    <rect x="476" y="232" width="16" height="16" fill="#a86ad0"/>
    <rect x="500" y="232" width="16" height="16" fill="#a86ad0"/>
    <rect x="524" y="232" width="16" height="16" fill="#a86ad0"/>

    <text x="0" y="292" fill="#d84a3a" font-size="15">MISSION 03</text>
    <text x="138" y="292" fill="#fff4d6" font-size="18" font-weight="700">PRODUCT SYSTEMS</text>
    <rect x="476" y="276" width="16" height="16" fill="#ff6a2a"/>
    <rect x="500" y="276" width="16" height="16" fill="#ff6a2a"/>
    <rect x="524" y="276" width="16" height="16" fill="#ff6a2a"/>

    <rect x="0" y="324" width="648" height="1" fill="#4a454e"/>
    <text x="0" y="358" fill="#8cff00" font-size="15">BUILD</text>
    <text x="76" y="358" fill="#77727d" font-size="15">/</text>
    <text x="100" y="358" fill="#d84a3a" font-size="15">SHIP</text>
    <text x="164" y="358" fill="#77727d" font-size="15">/</text>
    <text x="188" y="358" fill="#a86ad0" font-size="15">ITERATE</text>

    <text x="316" y="406" text-anchor="middle" fill="#fff4d6" font-size="18" class="blink">- PRESS START -</text>
