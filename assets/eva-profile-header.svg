      <text x="24" y="326" fill="#a86ad0">MODE</text><text x="112" y="326" fill="#8cff00">BUILDING</text>
      <text x="24" y="354" fill="#77727d">SYNC</text><text x="112" y="354" fill="#fff4d6">100.0%</text>
    </g>
  </g>

  <g class="mono" transform="translate(444 108)">
    <text x="0" y="34" fill="#8cff00" font-size="16">1UP</text>
    <text x="74" y="34" fill="#fff4d6" font-size="16">0001986</text>
    <text x="0" y="94" fill="#fff4d6" font-size="52" font-weight="900">DUKE YEAH</text>
    <rect x="0" y="110" width="640" height="8" fill="#6b278c"/>
