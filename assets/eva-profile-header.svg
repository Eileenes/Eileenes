  <rect x="1096" y="454" width="32" height="12" fill="#d84a3a"/>
  <rect x="1106" y="444" width="12" height="32" fill="#d84a3a"/>
  <circle cx="1144" cy="454" r="8" fill="#8cff00"/>
  <circle cx="1144" cy="476" r="8" fill="#6b278c"/>
