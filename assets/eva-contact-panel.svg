<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Eileenes communication console</title><desc id="desc">A futuristic pixel communication panel with open channel status</desc>
  <defs><pattern id="c-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#273033"/><rect width="2" height="2" fill="#536064" opacity=".34"/></pattern><filter id="c-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.pulse{animation:pulse 1.6s steps(2,end) infinite}.wave{animation:wave 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{opacity:.3}}@keyframes wave{50%{transform:scaleY(.35)}}@media(prefers-reduced-motion:reduce){.pulse,.wave{animation:none}}</style></defs>
  <rect width="1200" height="210" fill="#070a0c"/><rect width="1200" height="210" fill="url(#c-grid)" opacity=".72"/><rect x="14" y="14" width="1172" height="182" fill="none" stroke="#566267" stroke-width="2"/>
  <path d="M14 14H360V20H14Z" fill="#b9ff2c"/><path d="M360 14H720V20H360Z" fill="#ff5c35"/><path d="M720 14H1186V20H720Z" fill="#10d9cc"/>
  <g class="mono"><rect x="42" y="44" width="14" height="14" fill="#b9ff2c" filter="url(#c-glow)" class="pulse"/><text x="72" y="56" fill="#b9ff2c" font-size="12">COMMUNICATION CHANNEL</text><text x="42" y="118" fill="#f3f8f7" font-size="34" font-weight="900">SIGNAL OPEN</text><text x="42" y="151" fill="#7d898c" font-size="12">GITHUB / EMAIL / IDEAS IN MOTION</text>
  <path d="M540 76V134M558 90V120M576 64V146M594 98V112M612 78V132M630 54V156M648 88V122M666 70V140M684 94V116M702 80V130M720 60V150M738 92V118M756 72V138" stroke="#10d9cc" stroke-width="8" class="wave"/>
  <rect x="864" y="52" width="282" height="46" fill="#12191c" stroke="#465256"/><text x="884" y="81" fill="#f3f8f7" font-size="13">GITHUB // EILEENES</text><rect x="864" y="112" width="282" height="46" fill="#12191c" stroke="#465256"/><text x="884" y="141" fill="#f3f8f7" font-size="13">MAIL // DUKEYEAH</text><rect x="1128" y="64" width="8" height="22" fill="#b9ff2c" class="pulse"/><rect x="1128" y="124" width="8" height="22" fill="#ff5c35" class="pulse"/></g>
</svg>
