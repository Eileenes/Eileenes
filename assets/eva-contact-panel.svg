<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Eileenes communications channel</title>
  <desc id="desc">A triple-color mecha communications status panel</desc>
  <defs>
    <pattern id="contact-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#25232a"/></pattern>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .wave { animation: wave 2.6s ease-in-out infinite; transform-origin: left center; }
      .dot { animation: blink 1.4s steps(2, start) infinite; }
      @keyframes wave { 50% { transform: scaleX(.68); opacity: .5; } }
      @keyframes blink { 50% { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) { .wave, .dot { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="190" fill="#08090b"/>
  <rect width="1200" height="190" fill="url(#contact-grid)" opacity=".65"/>
  <rect x="12" y="12" width="1176" height="166" fill="none" stroke="#3a363f" stroke-width="2"/>
  <path d="M12 12H404" stroke="#8cff00" stroke-width="6"/><path d="M404 12H796" stroke="#d62828" stroke-width="6"/><path d="M796 12H1188" stroke="#2357d4" stroke-width="6"/>
  <g class="mono">
    <text x="42" y="55" fill="#8cff00" font-size="14">COMMS CONTROL // CHANNEL OPEN</text>
    <text x="42" y="105" fill="#f4f1f6" font-size="28" font-weight="700">GITHUB / EILEENES</text>
    <text x="42" y="142" fill="#aaa3ae" font-size="16">EMAIL / DUKEYEAH@163.COM</text>
    <circle cx="782" cy="94" r="8" fill="#8cff00" class="dot"/><text x="804" y="100" fill="#8cff00" font-size="14">ONLINE</text>
    <text x="1128" y="55" text-anchor="end" fill="#77717c" font-size="12">01 / 02 / 00 LINKED</text>
  </g>
  <g transform="translate(790 118)" fill="none" stroke-width="5">
    <path d="M0 18H62L78 0L96 36L114 10L132 26L150 18H214" stroke="#8cff00" class="wave"/>
    <path d="M230 18H278" stroke="#d62828"/><path d="M294 18H338" stroke="#ffd33d"/>
  </g>
</svg>
