<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1240" viewBox="0 0 720 1240" role="img" aria-labelledby="title desc">
  <title id="title">Eileenes mobile four-module project hangar</title><desc id="desc">A mobile mission-control stack for repo-brief, Recruitment, memoranote and DukeNote</desc>
  <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#292a30"/><rect width="2" height="2" fill="#64656c" opacity=".28"/></pattern><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f4ef"/><stop offset=".28" stop-color="#9ca2a0"/><stop offset=".52" stop-color="#e3e7e2"/><stop offset="1" stop-color="#676c6c"/></linearGradient><style>.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.new{animation:blink 1.3s steps(2,end) infinite}.meter{animation:meter 2.8s steps(5,end) infinite;transform-box:fill-box;transform-origin:left}@keyframes blink{50%{opacity:.35}}@keyframes meter{50%{transform:scaleX(.46)}}@media(prefers-reduced-motion:reduce){.new,.meter{animation:none}}</style></defs>
  <rect width="720" height="1240" fill="#07080a"/><rect width="720" height="1240" fill="url(#grid)" opacity=".72"/><rect x="12" y="12" width="696" height="1216" fill="none" stroke="#585b63" stroke-width="2"/>
  <path d="M12 12H186V20H12Z" fill="#a7ff16"/><path d="M186 12H360V20H186Z" fill="#6e2c9d"/><path d="M360 12H534V20H360Z" fill="#d82931"/><path d="M534 12H708V20H534Z" fill="#ff762d"/>
  <g class="mono"><text x="36" y="58" fill="#f4f4f1" font-size="16" font-weight="700">MISSION HANGAR</text><text x="684" y="58" text-anchor="end" fill="#a7ff16" font-size="11">04 / 01 NEW</text></g>

  <g class="mono" transform="translate(36 86)"><rect width="648" height="260" fill="#111318" stroke="#444750" stroke-width="2"/><rect width="648" height="42" fill="#a7ff16"/><text x="16" y="28" fill="#0a1007" font-size="13" font-weight="900">00 / REPO-BRIEF</text><rect x="522" y="10" width="108" height="22" fill="#0a1007"/><text x="576" y="25" text-anchor="middle" fill="#a7ff16" font-size="10" class="new">NEW SIGNAL</text><g transform="translate(46 82)" shape-rendering="crispEdges"><path d="M0 0H122V104H0Z" fill="#0b0d10" stroke="url(#metal)" stroke-width="8"/><path d="M20 26L42 42L20 60" fill="none" stroke="#a7ff16" stroke-width="8"/><rect x="54" y="58" width="44" height="8" fill="#d7dbd6"/><rect x="20" y="80" width="78" height="7" fill="#686e6e"/></g><text x="214" y="104" fill="#f4f4f1" font-size="13">SCAN / SUMMARIZE / SHARE</text><text x="214" y="134" fill="#8c8d94" font-size="11">20+ STACKS · MARKDOWN · GIT</text><rect x="214" y="168" width="350" height="7" fill="#2a2d32"/><rect x="214" y="168" width="310" height="7" fill="#a7ff16" class="meter"/><text x="214" y="202" fill="#a7ff16" font-size="10">PYTHON / CLI / MIT</text></g>

  <g class="mono" transform="translate(36 366)"><rect width="648" height="260" fill="#111318" stroke="#444750" stroke-width="2"/><rect width="648" height="42" fill="#d82931"/><text x="16" y="28" fill="#0d090a" font-size="13" font-weight="900">01 / RECRUITMENT</text><text x="626" y="28" text-anchor="end" fill="#4e0710" font-size="10">ACTIVE</text><g transform="translate(42 84)" shape-rendering="crispEdges"><path d="M36 0H88V12H110V26H124V78H110V92H88V104H36V92H14V78H0V26H14V12H36Z" fill="none" stroke="url(#metal)" stroke-width="8"/><rect x="32" y="36" width="22" height="13" fill="#d82931"/><rect x="72" y="36" width="22" height="13" fill="#a7ff16"/><rect x="52" y="64" width="22" height="13" fill="#f4f4f1"/></g><text x="214" y="104" fill="#f4f4f1" font-size="13">SEARCH / RANK / DELIVER</text><text x="214" y="134" fill="#8c8d94" font-size="11">PUBLIC SIGNALS · WEBHOOK</text><rect x="214" y="168" width="350" height="7" fill="#2a2d32"/><rect x="214" y="168" width="270" height="7" fill="#d82931" class="meter"/><text x="214" y="202" fill="#ff686d" font-size="10">GO / REACT / POSTGRESQL / LLM</text></g>

  <g class="mono" transform="translate(36 646)"><rect width="648" height="260" fill="#111318" stroke="#444750" stroke-width="2"/><rect width="648" height="42" fill="#6e2c9d"/><text x="16" y="28" fill="#f4f4f1" font-size="13" font-weight="900">02 / MEMORANOTE</text><text x="626" y="28" text-anchor="end" fill="#dcb6ee" font-size="10">NATIVE</text><g transform="translate(54 76)" shape-rendering="crispEdges"><path d="M0 0H100V116H0Z" fill="url(#metal)"/><path d="M0 0H14V116H0Z" fill="#6e2c9d"/><rect x="32" y="24" width="48" height="10" fill="#17191d"/><rect x="32" y="50" width="38" height="10" fill="#747a7a"/><rect x="32" y="76" width="48" height="10" fill="#a7ff16"/><rect x="32" y="98" width="30" height="8" fill="#d82931"/></g><text x="214" y="104" fill="#f4f4f1" font-size="13">CAPTURE / ORGANIZE / RECALL</text><text x="214" y="134" fill="#8c8d94" font-size="11">QUIET NOTES · NATIVE FLOW</text><rect x="214" y="168" width="350" height="7" fill="#2a2d32"/><rect x="214" y="168" width="286" height="7" fill="#6e2c9d" class="meter"/><text x="214" y="202" fill="#c78be3" font-size="10">SWIFT / SWIFTUI / IOS</text></g>

  <g class="mono" transform="translate(36 926)"><rect width="648" height="260" fill="#111318" stroke="#444750" stroke-width="2"/><rect width="648" height="42" fill="#ff762d"/><text x="16" y="28" fill="#120b07" font-size="13" font-weight="900">03 / DUKENOTE</text><text x="626" y="28" text-anchor="end" fill="#5a2104" font-size="10">NOTEBOOK</text><g transform="translate(46 84)" shape-rendering="crispEdges"><path d="M0 0H118V102H0Z" fill="#111318" stroke="url(#metal)" stroke-width="8"/><rect x="20" y="18" width="78" height="15" fill="#ff762d"/><rect x="20" y="48" width="54" height="8" fill="#d7dbd6"/><rect x="20" y="68" width="70" height="8" fill="#707676"/><rect x="20" y="86" width="40" height="8" fill="#a7ff16"/></g><text x="214" y="104" fill="#f4f4f1" font-size="13">WRITE / STRUCTURE / MAINTAIN</text><text x="214" y="134" fill="#8c8d94" font-size="11">CLEAR NOTES · LONG TERM</text><rect x="214" y="168" width="350" height="7" fill="#2a2d32"/><rect x="214" y="168" width="248" height="7" fill="#ff762d" class="meter"/><text x="214" y="202" fill="#ff9d67" font-size="10">SWIFT / SWIFTUI / MIT</text></g>
  <g class="mono" font-size="10"><text x="36" y="1212" fill="#707179">HANGAR / 010</text><text x="684" y="1212" text-anchor="end" fill="#707179">ALL MODULES LINKED</text></g>
</svg>
