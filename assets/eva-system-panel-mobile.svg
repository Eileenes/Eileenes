<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Duke Yeah mobile retro system loadout</title>
