<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Eileenes four-module project hangar</title>
  <desc id="desc">A purple, green, red and orange mission-control matrix for repo-brief, Recruitment, memoranote and DukeNote</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#292a30"/><rect width="2" height="2" fill="#64656c" opacity=".28"/></pattern>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f4ef"/><stop offset=".28" stop-color="#9ca2a0"/><stop offset=".52" stop-color="#e3e7e2"/><stop offset="1" stop-color="#676c6c"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.new{animation:blink 1.3s steps(2,end) infinite}.meter{animation:meter 2.8s steps(5,end) infinite;transform-box:fill-box;transform-origin:left}.scan{animation:scan 5s linear infinite}@keyframes blink{50%{opacity:.35}}@keyframes meter{50%{transform:scaleX(.46)}}@keyframes scan{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}}@media(prefers-reduced-motion:reduce){.new,.meter,.scan{animation:none}}</style>
  </defs>
  <rect width="1200" height="620" fill="#07080a"/><rect width="1200" height="620" fill="url(#grid)" opacity=".72"/><rect x="14" y="14" width="1172" height="592" fill="none" stroke="#585b63" stroke-width="2"/>
  <rect x="14" y="14" width="1172" height="58" fill="#111318"/><path d="M14 14H308V20H14Z" fill="#a7ff16"/><path d="M308 14H602V20H308Z" fill="#6e2c9d"/><path d="M602 14H896V20H602Z" fill="#d82931"/><path d="M896 14H1186V20H896Z" fill="#ff762d"/>
  <g class="mono"><text x="42" y="50" fill="#f4f4f1" font-size="17" font-weight="700">MISSION HANGAR // SELECTED WORK</text><text x="1158" y="50" text-anchor="end" fill="#a7ff16" font-size="12">04 MODULES / 01 NEW SIGNAL</text></g>
  <path d="M600 72V606M14 339H1186" stroke="#4b4e56" stroke-width="2"/><rect x="596" y="72" width="8" height="534" fill="#17191e"/>

  <!-- 00 repo-brief / new primary signal -->
  <g class="mono" transform="translate(42 94)">
    <rect width="516" height="36" fill="#a7ff16"/><text x="14" y="24" fill="#0a1007" font-size="13" font-weight="900">00 / REPO-BRIEF</text><rect x="410" y="8" width="92" height="20" fill="#0a1007"/><text x="456" y="22" text-anchor="middle" fill="#a7ff16" font-size="10" class="new">NEW SIGNAL</text>
    <text x="0" y="68" fill="#8c8d94" font-size="10">ZERO-DEPENDENCY REPOSITORY SCANNER</text>
    <g transform="translate(10 88)" shape-rendering="crispEdges"><path d="M0 0H128V112H0Z" fill="#111318" stroke="url(#metal)" stroke-width="8"/><path d="M20 28L42 46L20 64" fill="none" stroke="#a7ff16" stroke-width="8"/><rect x="54" y="60" width="48" height="8" fill="#d6dad5"/><rect x="20" y="84" width="82" height="7" fill="#656b6b"/></g>
    <text x="172" y="112" fill="#f4f4f1" font-size="13">SCAN / SUMMARIZE / SHARE</text><text x="172" y="142" fill="#8c8d94" font-size="11">20+ STACKS · MARKDOWN · GIT</text>
    <rect x="172" y="170" width="300" height="7" fill="#2a2d32"/><rect x="172" y="170" width="264" height="7" fill="#a7ff16" class="meter"/><text x="172" y="196" fill="#a7ff16" font-size="10">PYTHON / CLI / MIT</text>
  </g>

  <!-- 01 Recruitment -->
  <g class="mono" transform="translate(642 94)">
    <rect width="516" height="36" fill="#d82931"/><text x="14" y="24" fill="#0d090a" font-size="13" font-weight="900">01 / RECRUITMENT</text><text x="502" y="24" text-anchor="end" fill="#4e0710" font-size="10">ACTIVE</text>
    <text x="0" y="68" fill="#8c8d94" font-size="10">GITHUB TALENT SIGNAL SYSTEM</text>
    <g transform="translate(8 88)" shape-rendering="crispEdges"><path d="M42 0H98V12H122V28H138V84H122V100H98V112H42V100H18V84H2V28H18V12H42Z" fill="none" stroke="url(#metal)" stroke-width="8"/><rect x="38" y="38" width="24" height="14" fill="#d82931"/><rect x="78" y="38" width="24" height="14" fill="#a7ff16"/><rect x="58" y="66" width="24" height="14" fill="#f4f4f1"/></g>
    <text x="172" y="112" fill="#f4f4f1" font-size="13">SEARCH / RANK / DELIVER</text><text x="172" y="142" fill="#8c8d94" font-size="11">PUBLIC SIGNALS · WEBHOOK</text>
    <rect x="172" y="170" width="300" height="7" fill="#2a2d32"/><rect x="172" y="170" width="230" height="7" fill="#d82931" class="meter"/><text x="172" y="196" fill="#ff686d" font-size="10">GO / REACT / POSTGRESQL / LLM</text>
  </g>

  <!-- 02 memoranote -->
  <g class="mono" transform="translate(42 361)">
    <rect width="516" height="36" fill="#6e2c9d"/><text x="14" y="24" fill="#f4f4f1" font-size="13" font-weight="900">02 / MEMORANOTE</text><text x="502" y="24" text-anchor="end" fill="#dcb6ee" font-size="10">NATIVE</text>
    <text x="0" y="68" fill="#8c8d94" font-size="10">NATIVE MEMORY INTERFACE</text>
    <g transform="translate(20 84)" shape-rendering="crispEdges"><path d="M0 0H110V126H0Z" fill="url(#metal)"/><path d="M0 0H14V126H0Z" fill="#6e2c9d"/><rect x="34" y="26" width="54" height="10" fill="#17191d"/><rect x="34" y="54" width="42" height="10" fill="#747a7a"/><rect x="34" y="82" width="54" height="10" fill="#a7ff16"/><rect x="34" y="106" width="34" height="8" fill="#d82931"/></g>
    <text x="172" y="112" fill="#f4f4f1" font-size="13">CAPTURE / ORGANIZE / RECALL</text><text x="172" y="142" fill="#8c8d94" font-size="11">QUIET NOTES · NATIVE FLOW</text>
    <rect x="172" y="170" width="300" height="7" fill="#2a2d32"/><rect x="172" y="170" width="244" height="7" fill="#6e2c9d" class="meter"/><text x="172" y="196" fill="#c78be3" font-size="10">SWIFT / SWIFTUI / IOS</text>
  </g>

  <!-- 03 DukeNote -->
  <g class="mono" transform="translate(642 361)">
    <rect width="516" height="36" fill="#ff762d"/><text x="14" y="24" fill="#120b07" font-size="13" font-weight="900">03 / DUKENOTE</text><text x="502" y="24" text-anchor="end" fill="#5a2104" font-size="10">NOTEBOOK</text>
    <text x="0" y="68" fill="#8c8d94" font-size="10">STRUCTURED NOTE MODULE</text>
    <g transform="translate(14 90)" shape-rendering="crispEdges"><path d="M0 0H126V108H0Z" fill="#111318" stroke="url(#metal)" stroke-width="8"/><rect x="20" y="18" width="86" height="16" fill="#ff762d"/><rect x="20" y="50" width="58" height="8" fill="#d7dbd6"/><rect x="20" y="72" width="78" height="8" fill="#707676"/><rect x="20" y="92" width="44" height="8" fill="#a7ff16"/></g>
    <text x="172" y="112" fill="#f4f4f1" font-size="13">WRITE / STRUCTURE / MAINTAIN</text><text x="172" y="142" fill="#8c8d94" font-size="11">CLEAR NOTES · LONG TERM</text>
    <rect x="172" y="170" width="300" height="7" fill="#2a2d32"/><rect x="172" y="170" width="212" height="7" fill="#ff762d" class="meter"/><text x="172" y="196" fill="#ff9d67" font-size="10">SWIFT / SWIFTUI / MIT</text>
  </g>

  <g class="mono" font-size="10"><text x="42" y="592" fill="#707179">HANGAR / 010</text><text x="1158" y="592" text-anchor="end" fill="#707179">ALL MODULES LINKED</text></g><rect x="0" y="0" width="3" height="620" fill="#a7ff16" opacity=".45" class="scan"/>
</svg>
