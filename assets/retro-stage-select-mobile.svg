<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Duke Yeah mobile retro stage select</title>
  <desc id="desc">Three stacked eight-bit project stages</desc>
  <defs>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .select { animation: select 1.3s steps(2, start) infinite; }
      @keyframes select { 50% { opacity: .42; } }
      @media (prefers-reduced-motion: reduce) { .select { animation: none; } }
    </style>
  </defs>
  <rect width="720" height="900" fill="#b7b2aa"/>
  <rect x="10" y="10" width="700" height="880" fill="#d84a3a"/>
  <rect x="22" y="22" width="676" height="856" fill="#29252d"/>
  <rect x="38" y="38" width="644" height="824" fill="#0c0b0f"/>
  <rect x="38" y="38" width="644" height="50" fill="#fff4d6"/>
  <text x="58" y="71" class="mono" fill="#29252d" font-size="19" font-weight="700">WORLD 01 // SELECT STAGE</text>

  <g class="mono" transform="translate(72 118)">
    <rect width="576" height="206" fill="#17141b" stroke="#8cff00" stroke-width="6" class="select"/>
    <text x="28" y="42" fill="#8cff00" font-size="16">STAGE 01</text>
    <text x="28" y="82" fill="#fff4d6" font-size="28" font-weight="700">RECRUITMENT</text>
    <text x="28" y="116" fill="#b7b2aa" font-size="15">SIGNAL SEARCH MISSION</text>
    <text x="28" y="166" fill="#d84a3a" font-size="14">GO / REACT / POSTGRESQL / LLM</text>
    <g transform="translate(434 44)" fill="#fff4d6">
      <rect x="24" width="48" height="12"/><rect x="12" y="12" width="72" height="12"/><rect y="24" width="36" height="48"/><rect x="60" y="24" width="36" height="48"/><rect x="12" y="72" width="72" height="12"/><rect x="48" y="84" width="12" height="36" fill="#d84a3a"/>
    </g>
  </g>

  <g class="mono" transform="translate(72 352)">
    <rect width="576" height="206" fill="#17141b" stroke="#6b278c" stroke-width="4"/>
    <text x="28" y="42" fill="#a86ad0" font-size="16">STAGE 02</text>
    <text x="28" y="82" fill="#fff4d6" font-size="28" font-weight="700">MEMORANOTE</text>
    <text x="28" y="116" fill="#b7b2aa" font-size="15">MEMORY CAPTURE MISSION</text>
    <text x="28" y="166" fill="#8cff00" font-size="14">SWIFT / SWIFTUI / IOS</text>
    <g transform="translate(452 42)"><rect width="84" height="112" fill="#fff4d6"/><rect width="12" height="112" fill="#d84a3a"/><rect x="24" y="28" width="48" height="8" fill="#6b278c"/><rect x="24" y="52" width="36" height="8" fill="#29252d"/><rect x="24" y="76" width="48" height="8" fill="#8cff00"/></g>
  </g>

  <g class="mono" transform="translate(72 586)">
    <rect width="576" height="206" fill="#17141b" stroke="#d84a3a" stroke-width="4"/>
    <text x="28" y="42" fill="#d84a3a" font-size="16">STAGE 03</text>
    <text x="28" y="82" fill="#fff4d6" font-size="28" font-weight="700">DUKENOTE</text>
    <text x="28" y="116" fill="#b7b2aa" font-size="15">NOTE SYSTEM MISSION</text>
    <text x="28" y="166" fill="#ff6a2a" font-size="14">SWIFT / SWIFTUI / MIT</text>
    <g transform="translate(440 42)"><rect width="108" height="108" fill="#b7b2aa"/><rect x="12" y="12" width="84" height="72" fill="#fff4d6"/><rect x="24" y="28" width="60" height="8" fill="#6b278c"/><rect x="24" y="50" width="48" height="8" fill="#29252d"/><rect x="24" y="72" width="60" height="8" fill="#8cff00"/><rect x="24" y="92" width="60" height="8" fill="#d84a3a"/></g>
  </g>

  <text x="360" y="836" text-anchor="middle" class="mono" fill="#fff4d6" font-size="16">3 MISSIONS FOUND // PLAYER 1 READY</text>
</svg>
