<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Eileenes five-module project hangar</title>
  <desc id="desc">A five-module mission-control matrix for agent-memory-health, repo-brief, Recruitment, memoranote and DukeNote</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#292a30"/><rect width="2" height="2" fill="#64656c" opacity=".28"/></pattern>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f4ef"/><stop offset=".28" stop-color="#9ca2a0"/><stop offset=".52" stop-color="#e3e7e2"/><stop offset="1" stop-color="#676c6c"/></linearGradient>
    <style>.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.new{animation:blink 1.3s steps(2,end) infinite}.meter{animation:meter 2.8s steps(5,end) infinite;transform-box:fill-box;transform-origin:left}.scan{animation:scan 5s linear infinite}@keyframes blink{50%{opacity:.35}}@keyframes meter{50%{transform:scaleX(.46)}}@keyframes scan{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}}@media(prefers-reduced-motion:reduce){.new,.meter,.scan{animation:none}}</style>
  </defs>
  <rect width="1200" height="860" fill="#07080a"/><rect width="1200" height="860" fill="url(#grid)" opacity=".72"/><rect x="14" y="14" width="1172" height="832" fill="none" stroke="#585b63" stroke-width="2"/>
  <rect x="14" y="14" width="1172" height="58" fill="#111318"/><path d="M14 14H248V20H14Z" fill="#36d6e7"/><path d="M248 14H482V20H248Z" fill="#a7ff16"/><path d="M482 14H716V20H482Z" fill="#d82931"/><path d="M716 14H950V20H716Z" fill="#6e2c9d"/><path d="M950 14H1186V20H950Z" fill="#ff762d"/>
  <g class="mono"><text x="42" y="50" fill="#f4f4f1" font-size="17" font-weight="700">MISSION HANGAR // SELECTED WORK</text><text x="1158" y="50" text-anchor="end" fill="#36d6e7" font-size="12">05 MODULES / 01 NEW SIGNAL</text></g>

  <!-- 00 agent-memory-health / new primary signal -->
  <g class="mono" transform="translate(42 94)">
    <rect width="1116" height="210" fill="#111318" stroke="#4b4e56" stroke-width="2"/><rect width="1116" height="38" fill="#36d6e7"/><text x="14" y="25" fill="#061113" font-size="13" font-weight="900">00 / AGENT-MEMORY-HEALTH</text><rect x="994" y="8" width="108" height="22" fill="#061113"/><text x="1048" y="23" text-anchor="middle" fill="#36d6e7" font-size="10" class="new">NEW SIGNAL</text>
    <text x="18" y="70" fill="#8c8d94" font-size="10">AI AGENT MEMORY HEALTH AUDITOR</text>
    <g transform="translate(38 88)" shape-rendering="crispEdges"><path d="M18 8H92L114 30V96H18Z" fill="#0b0d10" stroke="url(#metal)" stroke-width="7"/><circle cx="48" cy="42" r="10" fill="#36d6e7"/><circle cx="84" cy="42" r="10" fill="#a7ff16"/><circle cx="66" cy="72" r="10" fill="#d82931"/><path d="M48 42L84 42M48 42L66 72M84 42L66 72" stroke="#d7dbd6" stroke-width="4"/></g>
    <text x="190" y="108" fill="#f4f4f1" font-size="14">AUDIT / SCORE / OPTIMIZE</text><text x="190" y="140" fill="#8c8d94" font-size="11">TOKEN COST · REPEATED SEARCH · KNOWLEDGE DRIFT</text><rect x="190" y="166" width="700" height="7" fill="#2a2d32"/><rect x="190" y="166" width="616" height="7" fill="#36d6e7" class="meter"/><text x="920" y="171" fill="#75eaf5" font-size="10">PYTHON 3.10+ / CLI / MIT</text>
  </g>

  <!-- 01 repo-brief -->
  <g class="mono" transform="translate(42 326)"><rect width="516" height="226" fill="#111318" stroke="#4b4e56" stroke-width="2"/><rect width="516" height="36" fill="#a7ff16"/><text x="14" y="24" fill="#0a1007" font-size="13" font-weight="900">01 / REPO-BRIEF</text><text x="502" y="24" text-anchor="end" fill="#304b04" font-size="10">CLI</text><text x="16" y="68" fill="#8c8d94" font-size="10">ZERO-DEPENDENCY REPOSITORY SCANNER</text><g transform="translate(26 90)" shape-rendering="crispEdges"><path d="M0 0H118V100H0Z" fill="#0b0d10" stroke="url(#metal)" stroke-width="8"/><path d="M20 24L42 40L20 58" fill="none" stroke="#a7ff16" stroke-width="8"/><rect x="54" y="56" width="42" height="8" fill="#d7dbd6"/><rect x="20" y="78" width="76" height="7" fill="#686e6e"/></g><text x="172" y="112" fill="#f4f4f1" font-size="13">SCAN / SUMMARIZE / SHARE</text><text x="172" y="142" fill="#8c8d94" font-size="11">20+ STACKS · MARKDOWN · GIT</text><rect x="172" y="170" width="300" height="7" fill="#2a2d32"/><rect x="172" y="170" width="264" height="7" fill="#a7ff16" class="meter"/><text x="172" y="198" fill="#a7ff16" font-size="10">PYTHON / CLI / MIT</text></g>

  <!-- 02 Recruitment -->
  <g class="mono" transform="translate(642 326)"><rect width="516" height="226" fill="#111318" stroke="#4b4e56" stroke-width="2"/><rect width="516" height="36" fill="#d82931"/><text x="14" y="24" fill="#0d090a" font-size="13" font-weight="900">02 / RECRUITMENT</text><text x="502" y="24" text-anchor="end" fill="#4e0710" font-size="10">ACTIVE</text><text x="16" y="68" fill="#8c8d94" font-size="10">GITHUB TALENT SIGNAL SYSTEM</text><g transform="translate(20 90)" shape-rendering="crispEdges"><path d="M38 0H90V10H112V24H126V76H112V90H90V100H38V90H16V76H2V24H16V10H38Z" fill="none" stroke="url(#metal)" stroke-width="8"/><rect x="34" y="34" width="22" height="13" fill="#d82931"/><rect x="74" y="34" width="22" height="13" fill="#a7ff16"/><rect x="54" y="62" width="22" height="13" fill="#f4f4f1"/></g><text x="172" y="112" fill="#f4f4f1" font-size="13">SEARCH / RANK / DELIVER</text><text x="172" y="142" fill="#8c8d94" font-size="11">PUBLIC SIGNALS · WEBHOOK</text><rect x="172" y="170" width="300" height="7" fill="#2a2d32"/><rect x="172" y="170" width="230" height="7" fill="#d82931" class="meter"/><text x="172" y="198" fill="#ff686d" font-size="10">GO / REACT / POSTGRESQL / LLM</text></g>

  <!-- 03 memoranote -->
  <g class="mono" transform="translate(42 574)"><rect width="516" height="226" fill="#111318" stroke="#4b4e56" stroke-width="2"/><rect width="516" height="36" fill="#6e2c9d"/><text x="14" y="24" fill="#f4f4f1" font-size="13" font-weight="900">03 / MEMORANOTE</text><text x="502" y="24" text-anchor="end" fill="#dcb6ee" font-size="10">NATIVE</text><text x="16" y="68" fill="#8c8d94" font-size="10">NATIVE MEMORY INTERFACE</text><g transform="translate(36 84)" shape-rendering="crispEdges"><path d="M0 0H94V108H0Z" fill="url(#metal)"/><path d="M0 0H13V108H0Z" fill="#6e2c9d"/><rect x="30" y="22" width="46" height="9" fill="#17191d"/><rect x="30" y="47" width="36" height="9" fill="#747a7a"/><rect x="30" y="72" width="46" height="9" fill="#a7ff16"/><rect x="30" y="94" width="28" height="7" fill="#d82931"/></g><text x="172" y="112" fill="#f4f4f1" font-size="13">CAPTURE / ORGANIZE / RECALL</text><text x="172" y="142" fill="#8c8d94" font-size="11">QUIET NOTES · NATIVE FLOW</text><rect x="172" y="170" width="300" height="7" fill="#2a2d32"/><rect x="172" y="170" width="244" height="7" fill="#6e2c9d" class="meter"/><text x="172" y="198" fill="#c78be3" font-size="10">SWIFT / SWIFTUI / IOS</text></g>

  <!-- 04 DukeNote -->
  <g class="mono" transform="translate(642 574)"><rect width="516" height="226" fill="#111318" stroke="#4b4e56" stroke-width="2"/><rect width="516" height="36" fill="#ff762d"/><text x="14" y="24" fill="#120b07" font-size="13" font-weight="900">04 / DUKENOTE</text><text x="502" y="24" text-anchor="end" fill="#5a2104" font-size="10">NOTEBOOK</text><text x="16" y="68" fill="#8c8d94" font-size="10">STRUCTURED NOTE MODULE</text><g transform="translate(26 92)" shape-rendering="crispEdges"><path d="M0 0H118V98H0Z" fill="#111318" stroke="url(#metal)" stroke-width="8"/><rect x="20" y="16" width="78" height="14" fill="#ff762d"/><rect x="20" y="46" width="54" height="8" fill="#d7dbd6"/><rect x="20" y="66" width="70" height="8" fill="#707676"/><rect x="20" y="84" width="40" height="7" fill="#a7ff16"/></g><text x="172" y="112" fill="#f4f4f1" font-size="13">WRITE / STRUCTURE / MAINTAIN</text><text x="172" y="142" fill="#8c8d94" font-size="11">CLEAR NOTES · LONG TERM</text><rect x="172" y="170" width="300" height="7" fill="#2a2d32"/><rect x="172" y="170" width="212" height="7" fill="#ff762d" class="meter"/><text x="172" y="198" fill="#ff9d67" font-size="10">SWIFT / SWIFTUI / MIT</text></g>

  <g class="mono" font-size="10"><text x="42" y="830" fill="#707179">HANGAR / 011</text><text x="1158" y="830" text-anchor="end" fill="#707179">ALL MODULES LINKED</text></g><rect x="0" y="0" width="3" height="860" fill="#36d6e7" opacity=".45" class="scan"/>
</svg>
