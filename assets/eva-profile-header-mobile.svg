<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Eileenes mobile pilot profile</title>
  <desc id="desc">Mobile pixel interface with a glossy open mecha cockpit and a seated pilot silhouette</desc>
  <defs>
    <linearGradient id="m-paint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#cbd5d5"/><stop offset=".55" stop-color="#697579"/><stop offset=".75" stop-color="#f8ffff"/><stop offset="1" stop-color="#707b7e"/></linearGradient>
    <linearGradient id="m-matte" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#252c30"/><stop offset="1" stop-color="#080b0d"/></linearGradient>
    <radialGradient id="m-bay"><stop stop-color="#17302d"/><stop offset=".6" stop-color="#07110f"/><stop offset="1" stop-color="#020404"/></radialGradient>
    <pattern id="m-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#263033"/><rect width="2" height="2" fill="#536064" opacity=".35"/></pattern>
    <filter id="m-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="m-clip"><path d="M240 360Q360 282 480 360L502 505Q466 602 360 622Q254 602 218 505Z"/></clipPath>
    <style>.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.sans{font-family:Impact,"Arial Black",sans-serif;letter-spacing:0}.canopy{animation:open 7s cubic-bezier(.4,0,.2,1) infinite;transform-box:fill-box;transform-origin:50% 100%}.pilot{animation:pulse 3.4s ease-in-out infinite}.scan{animation:scan 4.8s linear infinite}.blink{animation:blink 1s steps(2,end) infinite}.signal{animation:signal 2.4s steps(3,end) infinite}@keyframes open{0%,8%{transform:translateY(40px);opacity:.45}22%,78%{transform:rotate(-10deg) translateY(-72px);opacity:1}92%,100%{transform:translateY(40px);opacity:.45}}@keyframes pulse{50%{opacity:.75}}@keyframes scan{from{transform:translateY(-850px)}to{transform:translateY(940px)}}@keyframes blink{50%{opacity:0}}@keyframes signal{50%{transform:scaleX(.35)}}@media(prefers-reduced-motion:reduce){.canopy,.pilot,.scan,.blink,.signal{animation:none}.canopy{transform:translateY(-72px)}}</style>
  </defs>
  <rect width="720" height="900" fill="#070a0c"/><rect width="720" height="900" fill="url(#m-grid)" opacity=".72"/>
  <rect x="12" y="12" width="696" height="876" fill="none" stroke="#566267" stroke-width="2"/>
  <path d="M12 12H246V20H12Z" fill="#b9ff2c"/><path d="M246 12H440V20H246Z" fill="#ff5c35"/><path d="M440 12H708V20H440Z" fill="#10d9cc"/>
  <g class="mono" text-anchor="middle">
    <text x="360" y="62" fill="#b9ff2c" font-size="13" font-weight="700">PILOT FILE // 010</text>
    <text x="360" y="132" class="sans" fill="#f3f8f7" font-size="62" font-weight="900">EILEENES</text>
    <text x="360" y="170" fill="#f3f8f7" font-size="17" font-weight="700">DUKE YEAH</text>
    <text x="360" y="198" fill="#7c888b" font-size="13">PRODUCT MANAGER · MAKER</text>
    <rect x="108" y="222" width="504" height="2" fill="#566267"/><rect x="108" y="222" width="154" height="6" fill="#b9ff2c"/>
    <text x="360" y="260" fill="#aab4b5" font-size="13">10 YEARS IN PRODUCT / HANDS-ON</text>
  </g>

  <circle cx="360" cy="490" r="220" fill="none" stroke="#10d9cc" stroke-width="2" stroke-dasharray="3 12" opacity=".35"/>
  <circle cx="360" cy="490" r="194" fill="none" stroke="#b9ff2c" stroke-dasharray="24 18" opacity=".3"/>

  <path d="M82 780L116 672L212 628L252 586H468L508 628L604 672L638 780Z" fill="url(#m-matte)" stroke="#455156" stroke-width="6"/>
  <path d="M92 772L128 686L218 646L252 634L232 738L176 780Z" fill="url(#m-paint)" stroke="#b7c0c1" stroke-width="4"/>
  <path d="M468 634L502 646L592 686L628 772L544 780L488 738Z" fill="url(#m-paint)" stroke="#b7c0c1" stroke-width="4"/>
  <path d="M120 716L190 680L178 734L136 754Z" fill="#ff5c35"/><path d="M530 680L600 716L584 754L542 734Z" fill="#b9ff2c"/>
  <path d="M242 692L280 752H440L478 692L466 780H254Z" fill="#11171a" stroke="#566267" stroke-width="4"/>
  <path d="M302 750H418" stroke="#10d9cc" stroke-width="8" class="signal"/>

  <path d="M240 360Q360 282 480 360L502 505Q466 602 360 622Q254 602 218 505Z" fill="url(#m-bay)" stroke="#657174" stroke-width="10"/>
  <g clip-path="url(#m-clip)">
    <path d="M226 392L278 426M494 392L442 426M224 528L282 504M496 528L438 504" stroke="#10d9cc" stroke-width="5" opacity=".5"/>
    <g class="pilot"><circle cx="360" cy="450" r="34" fill="#010202" stroke="#263534" stroke-width="4"/><path d="M304 592Q312 498 360 492Q408 498 416 592L398 618H322Z" fill="#010202" stroke="#263534" stroke-width="4"/><path d="M318 532L272 566M402 532L448 566" stroke="#020303" stroke-width="24"/><path d="M282 568H326M394 568H438" stroke="#b9ff2c" stroke-width="4"/><rect x="347" y="434" width="26" height="6" fill="#b9ff2c" filter="url(#m-glow)"/></g>
    <path d="M254 580Q360 544 466 580" fill="none" stroke="#b9ff2c" stroke-width="3" stroke-dasharray="10 9"/>
  </g>
  <path d="M230 372L180 424L194 528L234 500L246 388Z" fill="#151b1e" stroke="#667276" stroke-width="6"/><path d="M490 372L540 424L526 528L486 500L474 388Z" fill="#151b1e" stroke="#667276" stroke-width="6"/>
  <path d="M180 424L132 396L158 482L198 510Z" fill="url(#m-paint)" stroke="#b7c0c1" stroke-width="4"/><path d="M540 424L588 396L562 482L522 510Z" fill="url(#m-paint)" stroke="#b7c0c1" stroke-width="4"/>
  <g class="canopy"><path d="M232 386Q360 290 488 386L468 460Q360 408 252 460Z" fill="url(#m-paint)" stroke="#d9e1e1" stroke-width="7"/><path d="M260 382Q360 322 460 382L442 424Q360 386 278 424Z" fill="#111719" stroke="#566367" stroke-width="4"/><path d="M290 374Q360 338 430 374" fill="none" stroke="#fff" stroke-width="7" opacity=".7"/><path d="M250 432L204 408L238 472Z" fill="#ff5c35"/><path d="M470 432L516 408L482 472Z" fill="#b9ff2c"/><rect x="340" y="316" width="40" height="16" fill="#10d9cc" filter="url(#m-glow)"/></g>

  <g class="mono" text-anchor="middle">
    <rect x="112" y="812" width="496" height="44" fill="#11171a" stroke="#4f5b5f" stroke-width="2"/>
    <rect x="112" y="812" width="154" height="44" fill="#b9ff2c"/>
    <text x="189" y="840" fill="#07100d" font-size="12" font-weight="900">COCKPIT ONLINE</text>
    <text x="360" y="840" fill="#10d9cc" font-size="12">CN / DEFAULT</text>
    <text x="526" y="840" fill="#9aa5a7" font-size="12">EN / OPEN</text>
    <text x="360" y="880" fill="#667276" font-size="10">CURIOUS · LIFE · MUSIC</text>
  </g>
  <rect x="0" width="720" height="3" fill="#b9ff2c" opacity=".5" class="scan"/>
</svg>
