  <path d="M210 524L246 514L260 548L230 556Z" fill="#e8e2ca"/><path d="M254 516L290 532L272 560L246 546Z" fill="#e8e2ca"/><path d="M468 548L504 572L480 594L452 558Z" fill="#e8e2ca"/>
  <path d="M214 610L302 650L322 692L238 656Z" fill="url(#r)" stroke="#ff5a4b" stroke-width="5"/>
  <path d="M224 586Q156 624 170 716" fill="none" stroke="#ff762d" stroke-width="14" stroke-linecap="round"/><path d="M250 596Q194 642 208 728" fill="none" stroke="#d82931" stroke-width="10" stroke-linecap="round"/>

  <!-- lifted canopy -->
  <g class="canopy"><path d="M190 420L242 286L404 242L536 302L486 392L356 364L218 448Z" fill="url(#p)" stroke="#9d5bc2" stroke-width="8"/><path d="M242 296L398 254L500 302L458 334L350 316L246 354Z" fill="#d4a4e7" opacity=".38"/><path d="M240 286L122 176L194 338Z" fill="url(#p)" stroke="#9a54bd" stroke-width="6"/><path d="M404 242L546 168L478 292Z" fill="url(#p)" stroke="#9a54bd" stroke-width="6"/><path d="M214 410L288 342L410 342L486 380L446 416L332 390L236 448Z" fill="#17191d" stroke="#555861" stroke-width="5"/><rect x="346" y="260" width="58" height="14" fill="#a7ff16" filter="url(#glow)"/></g>

  <g class="mono" text-anchor="middle"><rect x="102" y="872" width="516" height="54" fill="#13151a" stroke="#4b4e57" stroke-width="2"/><rect x="102" y="872" width="180" height="54" fill="#a7ff16"/><text x="192" y="905" fill="#0a1007" font-size="12" font-weight="900">CANOPY OPEN</text><text x="362" y="905" fill="#d7a6ef" font-size="12">CN / DEFAULT</text><text x="540" y="905" fill="#9d9da6" font-size="12">EN / OPEN</text><text x="360" y="954" fill="#71727a" font-size="10">04 MODULES LINKED · LIFE &amp; MUSIC</text></g>
