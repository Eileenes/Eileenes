  <path d="M154 406L220 322L376 278L536 316L620 408L600 572L512 674L392 706L242 658L154 568L118 474Z" fill="url(#m)" stroke="#585b63" stroke-width="8"/>
  <path d="M220 414Q334 340 460 372L522 450L486 604Q392 682 270 626L194 528Z" fill="url(#bay)" stroke="#74787c" stroke-width="10"/>
