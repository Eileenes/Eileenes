  <path d="M196 462L260 438L298 466L246 506L184 494Z" fill="#160823" stroke="#6b238c" stroke-width="5"/><path d="M210 470L254 454L274 468L240 490L204 486Z" fill="#c98cff" filter="url(#glow)" class="eye"/>

