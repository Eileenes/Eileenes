<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">Eileenes mobile open cockpit mecha profile v4</title>
  <desc id="desc">A mobile profile with a purple, green, red and orange three-quarter-view mecha head, open canopy and seated black pilot silhouette</desc>
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c694ff"/><stop offset=".16" stop-color="#6e2c9d"/><stop offset=".42" stop-color="#321044"/><stop offset=".65" stop-color="#8d43be"/><stop offset=".82" stop-color="#250934"/><stop offset="1" stop-color="#5b1f7a"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7568"/><stop offset=".22" stop-color="#d6222c"/><stop offset=".62" stop-color="#76101e"/><stop offset=".8" stop-color="#ef3b32"/><stop offset="1" stop-color="#510914"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efffb0"/><stop offset=".36" stop-color="#a7ff16"/><stop offset=".82" stop-color="#2bbd16"/><stop offset="1" stop-color="#0a5917"/></linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#272b2f"/><stop offset=".55" stop-color="#101316"/><stop offset="1" stop-color="#050708"/></linearGradient>
    <radialGradient id="bay"><stop stop-color="#233626"/><stop offset=".48" stop-color="#09130d"/><stop offset="1" stop-color="#010202"/></radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#27282d"/><rect width="2" height="2" fill="#6a6870" opacity=".28"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><path d="M220 414Q334 340 460 372L522 450L486 604Q392 682 270 626L194 528Z"/></clipPath>
    <style>.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.display{font-family:Impact,"Arial Black",sans-serif;letter-spacing:0}.canopy{animation:lift 5.6s cubic-bezier(.4,0,.2,1) infinite;transform:translate(50px,72px) scale(.82) rotate(-3deg);transform-box:fill-box;transform-origin:80% 100%}.pilot{animation:pilot 3s ease-in-out infinite}.eye{animation:eye 2.1s ease-in-out infinite}.scan{animation:scan 5.2s linear infinite}.ring{animation:spin 22s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes lift{0%,100%{transform:translate(50px,72px) scale(.82) rotate(-3deg)}50%{transform:translate(42px,60px) scale(.82) rotate(-5deg)}}@keyframes pilot{50%{opacity:.72}}@keyframes eye{50%{opacity:.42}}@keyframes scan{from{transform:translateY(-980px)}to{transform:translateY(1040px)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.canopy,.pilot,.eye,.scan,.ring{animation:none}.canopy{transform:translate(46px,66px) scale(.82) rotate(-4deg)}}</style>
  </defs>
  <rect width="720" height="980" fill="#07080a"/><rect width="720" height="980" fill="url(#grid)" opacity=".72"/><rect x="12" y="12" width="696" height="956" fill="none" stroke="#575a62" stroke-width="2"/>
  <path d="M12 12H224V20H12Z" fill="#a7ff16"/><path d="M224 12H392V20H224Z" fill="#64258a"/><path d="M392 12H556V20H392Z" fill="#d82931"/><path d="M556 12H708V20H556Z" fill="#ff762d"/>
  <g class="mono" text-anchor="middle"><text x="360" y="66" fill="#a7ff16" font-size="13" font-weight="700">PILOT ARCHIVE // 010</text><text x="360" y="136" class="display" fill="#f5f3f7" font-size="54" font-weight="900">EILEENES</text><text x="360" y="176" fill="#f5f3f7" font-size="17" font-weight="700">DUKE YEAH</text><text x="360" y="204" fill="#8d8d96" font-size="13">PRODUCT MANAGER · MAKER</text><rect x="106" y="230" width="508" height="2" fill="#575962"/><rect x="106" y="230" width="166" height="7" fill="#a7ff16"/></g>

  <g transform="translate(360 526)" fill="none" opacity=".4"><circle r="276" stroke="#7a35a2" stroke-width="2" stroke-dasharray="28 18" class="ring"/><circle r="244" stroke="#a7ff16" stroke-dasharray="3 14"/><path d="M-290 0H-254M254 0H290M0-290V-254M0 254V290" stroke="#8f9098" stroke-width="2"/></g>

