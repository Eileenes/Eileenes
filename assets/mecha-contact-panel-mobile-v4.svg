<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Eileenes mobile mecha communication console v4</title><desc id="desc">A mobile four-color communication panel with four linked modules and an open channel</desc>
  <defs><pattern id="cm-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#273033"/><rect width="2" height="2" fill="#536064" opacity=".34"/></pattern><filter id="cm-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.pulse{animation:pulse 1.6s steps(2,end) infinite}.wave{animation:wave 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{opacity:.3}}@keyframes wave{50%{transform:scaleY(.35)}}@media(prefers-reduced-motion:reduce){.pulse,.wave{animation:none}}</style></defs>
  <rect width="720" height="360" fill="#070a0c"/><rect width="720" height="360" fill="url(#cm-grid)" opacity=".72"/><rect x="12" y="12" width="696" height="336" fill="none" stroke="#566267" stroke-width="2"/><path d="M12 12H186V20H12Z" fill="#a7ff16"/><path d="M186 12H360V20H186Z" fill="#6e2c9d"/><path d="M360 12H534V20H360Z" fill="#d82931"/><path d="M534 12H708V20H534Z" fill="#ff762d"/>
  <g class="mono"><rect x="40" y="46" width="14" height="14" fill="#a7ff16" filter="url(#cm-glow)" class="pulse"/><text x="70" y="58" fill="#a7ff16" font-size="12">COMMUNICATION CHANNEL</text><text x="40" y="118" fill="#f3f8f7" font-size="34" font-weight="900">SIGNAL OPEN</text>
  <path d="M40 168V214M58 180V202M76 154V228M94 188V194M112 170V212M130 148V234M148 180V202M166 160V222M184 186V196M202 172V210M220 152V230M238 182V200" stroke="#6e2c9d" stroke-width="8" class="wave"/>
  <rect x="278" y="154" width="390" height="54" fill="#12191c" stroke="#465256"/><text x="298" y="187" fill="#f3f8f7" font-size="13">GITHUB // EILEENES</text><rect x="650" y="170" width="8" height="22" fill="#a7ff16" class="pulse"/><rect x="278" y="222" width="390" height="54" fill="#12191c" stroke="#465256"/><text x="298" y="255" fill="#f3f8f7" font-size="13">MAIL // DUKEYEAH</text><rect x="650" y="238" width="8" height="22" fill="#d82931" class="pulse"/><text x="40" y="316" fill="#7d898c" font-size="11">04 MODULES LINKED / IDEAS IN MOTION</text></g>
</svg>
